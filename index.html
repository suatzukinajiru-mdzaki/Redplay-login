<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <title>Entrar - RedPlay</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --vermelho: #e50914;
            --vermelho-hover: #f6121d;
            --fundo-overlay: rgba(0, 0, 0, 0.75);
            --input-bg: rgba(22, 22, 22, 0.7);
            --input-borda: rgba(255, 255, 255, 0.2);
            --texto: #ffffff;
            --texto-suave: #b3b3b3;
            --safe-h: 4vh;
            --safe-v: 4vw;
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Montserrat', Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            background: #000;
            color: var(--texto);
            user-select: none;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: var(--safe-h) var(--safe-v);
            /* Fundo estilo Netflix com gradiente e imagem simulação de catálogo */
            background: 
                linear-gradient(to top, rgba(0, 0, 0, 0.9) 0%, rgba(0, 0, 0, 0.6) 50%, rgba(0, 0, 0, 0.9) 100%),
                radial-gradient(ellipse at center, rgba(229, 9, 20, 0.15) 0%, transparent 70%),
                #000;
            background-size: cover;
            background-position: center;
        }

        /* Container Principal Integrado (Sem Retângulo Fechado) */
        .login-wrapper {
            width: 100%;
            max-width: min(420px, 92vw);
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: fadeIn 0.6s ease-out;
            z-index: 2;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Header / Logo */
        .logo-container {
            margin-bottom: clamp(20px, 3vh, 35px);
            text-align: center;
        }

        .logo-red {
            width: clamp(140px, 18vw, 200px);
            filter: drop-shadow(0 0 25px rgba(229, 9, 20, 0.6));
        }

        .titulo-login {
            color: var(--texto);
            font-size: clamp(24px, 3.5vh, 32px);
            font-weight: 800;
            margin-bottom: clamp(20px, 3vh, 30px);
            width: 100%;
            text-align: left;
            letter-spacing: -0.5px;
        }

        /* Form Controls */
        #login-form {
            width: 100%;
        }

        .input-group {
            position: relative;
            margin-bottom: 18px;
            width: 100%;
        }

        .input-group input {
            width: 100%;
            padding: 22px 18px 8px;
            background: var(--input-bg);
            border: 1.5px solid var(--input-borda);
            border-radius: 8px;
            color: #fff;
            font-size: clamp(14px, 1.8vh, 16px);
            font-weight: 600;
            outline: none;
            backdrop-filter: blur(10px);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .input-group label {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--texto-suave);
            font-size: clamp(14px, 1.8vh, 16px);
            font-weight: 500;
            transition: all 0.2s ease;
            pointer-events: none;
        }

        /* Label Flutuante Ativo */
        .input-group input:focus + label,
        .input-group input:not(:placeholder-shown) + label {
            top: 12px;
            font-size: 10px;
            font-weight: 800;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        /* Foco em TV / D-pad */
        .input-group input:focus,
        .input-group input.foco {
            border-color: #fff !important;
            background: rgba(40, 40, 40, 0.9);
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.8), 0 0 30px rgba(229, 9, 20, 0.5);
            transform: scale(1.02);
        }

        /* Botão Entrar */
        .btn-entrar {
            width: 100%;
            padding: clamp(16px, 2.2vh, 20px);
            background: var(--vermelho);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: clamp(15px, 2vh, 18px);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.25s ease;
            margin-top: 10px;
            margin-bottom: 20px;
            box-shadow: 0 8px 25px rgba(229, 9, 20, 0.4);
            outline: none;
        }

        .btn-entrar:hover,
        .btn-entrar:focus,
        .btn-entrar.foco {
            background: var(--vermelho-hover);
            transform: scale(1.03);
            box-shadow: 0 0 0 4px #fff, 0 10px 35px rgba(229, 9, 20, 0.8);
        }

        /* Links Auxiliares */
        .auxiliar-links {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: clamp(12px, 1.5vh, 14px);
            color: var(--texto-suave);
            width: 100%;
        }

        .auxiliar-links label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .auxiliar-links input[type="checkbox"] {
            accent-color: var(--vermelho);
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .auxiliar-links a {
            color: var(--texto-suave);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }

        .auxiliar-links a:hover,
        .auxiliar-links a:focus {
            color: #fff;
            text-decoration: underline;
        }

        /* Rodapé Integrado */
        .footer-login {
            margin-top: 40px;
            width: 100%;
            text-align: left;
            font-size: clamp(13px, 1.6vh, 15px);
            color: var(--texto-suave);
        }

        .footer-login p {
            margin-bottom: 12px;
            font-weight: 500;
        }

        .footer-login a {
            color: #fff;
            text-decoration: none;
            font-weight: 700;
        }

        .footer-login a:hover {
            text-decoration: underline;
        }

        .recaptcha-texto {
            font-size: 11px;
            color: #777;
            line-height: 1.5;
            margin-top: 15px;
        }

        .recaptcha-texto a {
            color: #0071eb;
            text-decoration: none;
        }

        /* Ocultar Cursor para Android TV */
        body { cursor: none; }
        @media (pointer: fine) { body { cursor: default; } }
    </style>
</head>
<body>

    <div class="login-wrapper">
        
        <!-- Logo -->
        <div class="logo-container">
            <img src="download.png" alt="RedPlay" class="logo-red" onerror="this.src='https://via.placeholder.com/200x60/e50914/ffffff?text=RedPlay'">
        </div>
        
        <h1 class="titulo-login">Entrar</h1>

        <form id="login-form">
            <!-- Email/Usuário -->
            <div class="input-group">
                <input type="text" id="usuario" placeholder=" " required autocomplete="username" tabindex="0">
                <label for="usuario">Email ou número de telefone</label>
            </div>

            <!-- Senha -->
            <div class="input-group">
                <input type="password" id="senha" placeholder=" " required autocomplete="current-password" tabindex="0">
                <label for="senha">Senha</label>
            </div>

            <!-- Botão Submit -->
            <button type="submit" class="btn-entrar" id="btn-entrar" tabindex="0">Entrar</button>

            <!-- Auxiliares -->
            <div class="auxiliar-links">
                <label tabindex="0">
                    <input type="checkbox" id="lembrar">
                    Lembrar de mim
                </label>
                <a href="#" tabindex="0">Precisa de ajuda?</a>
            </div>
        </form>

        <!-- Rodapé -->
        <div class="footer-login">
            <p>Novo na RedPlay? <a href="#" tabindex="0">Assine agora</a>.</p>
            <p class="recaptcha-texto">
                Esta página é protegida pelo Google reCAPTCHA para garantir que você não é um robô. 
                <a href="#">Saiba mais</a>.
            </p>
        </div>

    </div>

    <script>
        // Submissão do Formulário
        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            var usuario = document.getElementById('usuario').value.trim();
            var senha = document.getElementById('senha').value.trim();

            if (usuario && senha) {
                // Integração do Login
                console.log("Tentativa de login com:", usuario);
            } else {
                alert('Por favor, preencha todos os campos.');
            }
        });

        // Controle D-Pad para Smart TV / Android TV
        document.addEventListener('keydown', function(e) {
            var focusable = Array.prototype.slice.call(
                document.querySelectorAll('input, button, [tabindex="0"], a')
            ).filter(function(el) {
                return el.offsetParent !== null;
            });

            if (focusable.length === 0) return;
            var index = focusable.indexOf(document.activeElement);

            if (e.key === 'ArrowDown' || e.key === 'ArrowRight') {
                if (document.activeElement.tagName === 'INPUT' && e.key === 'ArrowRight') return;
                e.preventDefault();
                index = (index + 1) % focusable.length;
                focusable[index].focus();
            } else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
                if (document.activeElement.tagName === 'INPUT' && e.key === 'ArrowLeft') return;
                e.preventDefault();
                index = (index - 1 + focusable.length) % focusable.length;
                focusable[index].focus();
            }
        });
    </script>

</body>
</html>
