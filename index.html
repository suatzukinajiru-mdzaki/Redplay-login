<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#ffffff">
    <title>Entrar - RedPlay</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --vermelho: #e50914;
            --vermelho-escuro: #b20710;
            --fundo: #ffffff;
            --texto: #333333;
            --texto-suave: #666666;
            --input-bg: #f5f5f5;
            --input-borda: #dcdcdc;
            --safe-h: 4vh;
            --safe-v: 4vw;
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Montserrat', Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            background: var(--fundo);
            color: var(--texto);
            user-select: none;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: var(--safe-h) var(--safe-v);
            /* Fundo branco com um degradê muito sutil de vermelho nas bordas (opcional) */
            background: radial-gradient(circle at top right, rgba(229,9,20,0.03) 0%, transparent 50%),
                        radial-gradient(circle at bottom left, rgba(229,9,20,0.03) 0%, transparent 50%),
                        #ffffff;
        }

        /* ================= CARD DE LOGIN ================= */
        .login-card {
            background: #ffffff;
            width: 100%;
            max-width: min(450px, 90vw);
            padding: clamp(30px, 5vh, 60px) clamp(25px, 4vw, 50px);
            border-radius: 8px; /* Bordas levemente arredondadas, estilo Netflix */
            box-shadow: 0 10px 40px rgba(0,0,0,0.08); /* Sombra suave para dar profundidade no fundo branco */
            text-align: center;
            animation: cardFadeIn 0.6s ease-out;
        }

        @keyframes cardFadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Logo */
        .logo-red {
            width: clamp(110px, 15vw, 160px);
            margin-bottom: clamp(20px, 3vh, 30px);
            display: inline-block;
            /* Se a logo for preta, pode usar filter: invert(1) para deixá-la branca, ou deixar como está */
        }

        h1 {
            color: var(--texto);
            font-size: clamp(22px, 3vh, 28px);
            font-weight: 900;
            margin-bottom: 25px;
            text-align: left;
            letter-spacing: -0.5px;
        }

        /* ================= FORMULÁRIO ================= */
        .input-group {
            position: relative;
            margin-bottom: 16px;
            text-align: left;
        }

        .input-group input {
            width: 100%;
            padding: 20px 18px 8px; /* Padding maior em cima para o label flutuante */
            background: var(--input-bg);
            border: 1px solid var(--input-borda);
            border-radius: 6px;
            color: var(--texto);
            font-size: clamp(14px, 1.8vh, 16px);
            font-weight: 600;
            outline: none;
            transition: all 0.2s ease;
        }

        .input-group input:focus {
            border-color: var(--vermelho);
            background: #ffffff;
            box-shadow: 0 0 0 2px rgba(229,9,20,0.1);
        }

        /* Label flutuante (estilo Netflix) */
        .input-group label {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
            font-size: clamp(14px, 1.8vh, 16px);
            font-weight: 500;
            transition: all 0.2s ease;
            pointer-events: none;
        }

        /* Quando o input está focado ou preenchido, o label sobe */
        .input-group input:focus + label,
        .input-group input:not(:placeholder-shown) + label {
            top: 10px;
            font-size: 10px;
            font-weight: 700;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Ajuste para o padding do input quando o label sobe */
        .input-group input:focus,
        .input-group input:not(:placeholder-shown) {
            padding-top: 24px;
            padding-bottom: 8px;
        }

        /* ================= BOTÃO ================= */
        .btn-entrar {
            width: 100%;
            padding: clamp(14px, 2vh, 18px);
            background: var(--vermelho);
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: clamp(15px, 2vh, 17px);
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.1s ease;
            margin-top: 10px;
            margin-bottom: 20px;
        }

        .btn-entrar:hover {
            background: var(--vermelho-escuro);
        }

        .btn-entrar:active {
            transform: scale(0.98);
        }

        .btn-entrar:focus {
            outline: 3px solid #fff;
            box-shadow: 0 0 0 4px var(--vermelho);
        }

        /* ================= LINKS AUXILIARES ================= */
        .auxiliar-links {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: clamp(12px, 1.5vh, 14px);
            color: var(--texto-suave);
            margin-top: 10px;
        }

        .auxiliar-links label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-weight: 500;
        }

        .auxiliar-links input[type="checkbox"] {
            accent-color: var(--vermelho);
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .auxiliar-links a {
            color: var(--texto-suave);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }

        .auxiliar-links a:hover {
            color: var(--vermelho);
        }

        /* ================= RODAPÉ ================= */
        .footer-login {
            margin-top: 40px;
            text-align: left;
            font-size: clamp(12px, 1.5vh, 14px);
            color: var(--texto-suave);
            border-top: 1px solid #eee;
            padding-top: 20px;
        }

        .footer-login p {
            margin-bottom: 10px;
            font-weight: 500;
        }

        .footer-login a {
            color: var(--vermelho);
            text-decoration: none;
            font-weight: 700;
        }

        .footer-login a:hover {
            text-decoration: underline;
        }

        .recaptcha-texto {
            font-size: 11px;
            color: #999;
            line-height: 1.4;
            margin-top: 15px;
        }

        .recaptcha-texto a {
            color: #666;
            text-decoration: underline;
        }

        /* Cursor oculto para TV */
        body { cursor: none; }
        @media (pointer: fine) { body { cursor: default; } }
    </style>
</head>
<body>

    <!-- CARD DE LOGIN -->
    <div class="login-card">
        
        <!-- Substitua pela sua logo. Se a logo for branca, ela sumirá no fundo branco. 
             Use uma logo vermelha ou preta. -->
        <img src="https://via.placeholder.com/150x50/e50914/ffffff?text=RedPlay" alt="RedPlay" class="logo-red">
        
        <h1>Entrar</h1>

        <form id="login-form">
            <!-- Campo de Email/Usuário -->
            <div class="input-group">
                <input type="text" id="usuario" placeholder=" " required autocomplete="username">
                <label for="usuario">Email ou número de telefone</label>
            </div>

            <!-- Campo de Senha -->
            <div class="input-group">
                <input type="password" id="senha" placeholder=" " required autocomplete="current-password">
                <label for="senha">Senha</label>
            </div>

            <!-- Botão Entrar -->
            <button type="submit" class="btn-entrar" id="btn-entrar">Entrar</button>

            <!-- Links Auxiliares -->
            <div class="auxiliar-links">
                <label>
                    <input type="checkbox" id="lembrar">
                    Lembrar de mim
                </label>
                <a href="#">Precisa de ajuda?</a>
 => {
                       </div>
        </form>

        <!-- Rodapé -->
        <div class="footer-login">
            <p>Novo na RedPlay? <a href="#">Assine agora</a>.</p>
            <p class="recaptcha-texto">
                Esta página é protegida pelo Google reCAPTCHA para garantir que você não é um robô. 
                <a href="#">Saiba mais</a>.
            </p>
        </div>

    </div>

    <script>
        // Lógica simples de submit para demonstração
        document.getElementById('login-form').addEventListener('submit', (e) e.preventDefault();
            const usuario = document.getElementById('usuario').value;
            const senha = document.getElementById('senha').value;

            if (usuario && senha) {
                // Aqui você faria a chamada real para a API de login
                alert(`Login efetuado com sucesso!\nUsuário: ${usuario}`);
                // Redirecionar para a tela de boas-vindas (ex: tela-boas-vindas.html)
            } else {
                alert('Por favor, preencha todos os campos.');
            }
        });

        // Suporte a navegação por controle remoto (TV Box)
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const focused = document.activeElement;
                // Se o foco estiver em um input, não faz nada (deixa o form enviar)
                if (focused && focused.tagName === 'INPUT' && focused.type === 'text') return;
                
                if (focused && focused.id === 'btn-entrar') {
                    focused.click();
                }
            }
        });
    </script>

</body>
</html>
