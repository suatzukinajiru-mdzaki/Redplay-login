<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso RedPlay MAX</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --vermelho-redplay: #e50914;
            --vermelho-escuro: #b20710;
            --fundo-preto: #000000;
            --texto-claro: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; }

        body { background-color: var(--fundo-preto); color: var(--texto-claro); height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; position: relative; }

        #splash-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--fundo-preto);
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease-out;
        }
        
        .splash-logo { width: 180px; margin-bottom: 30px; animation: pulseSplash 1.5s infinite alternate; }

        .loader { border: 4px solid rgba(229, 9, 20, 0.2); border-top: 4px solid var(--vermelho-redplay); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }

        .bg-glow { position: absolute; width: 300px; height: 300px; background: radial-gradient(circle, rgba(229,9,20,0.15) 0%, rgba(0,0,0,0) 70%); top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 0; animation: pulseGlow 4s infinite alternate; }

        .login-box { position: relative; z-index: 1; background: rgba(15, 15, 15, 0.85); border: 1px solid rgba(229, 9, 20, 0.3); border-radius: 20px; padding: 40px 30px; width: 90%; max-width: 380px; text-align: center; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6); opacity: 0; transform: translateY(20px); transition: all 0.8s ease; }
        
        .login-box.show { opacity: 1; transform: translateY(0); }

        .login-logo { width: 140px; margin-bottom: 10px; mix-blend-mode: screen; }
        
        .badge { display: inline-block; background: linear-gradient(45deg, var(--vermelho-redplay), #ff4d4d); font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 0 10px rgba(229,9,20,0.4); }

        .input-container { margin-bottom: 15px; position: relative; }

        input { width: 100%; padding: 15px; background: rgba(0, 0, 0, 0.6); border: 2px solid #333; border-radius: 10px; color: white; font-size: 16px; text-align: center; transition: all 0.3s ease; outline: none; }
        input:focus { border-color: var(--vermelho-redplay); box-shadow: 0 0 15px rgba(229, 9, 20, 0.3); background: rgba(0, 0, 0, 0.9); }
        input::placeholder { color: #666; text-transform: uppercase; font-size: 14px; }

        .input-senha-wrap { position: relative; }
        .input-senha-wrap input { padding-right: 50px; }
        .btn-olho {
            position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
            background: transparent; border: none; color: #888; font-size: 22px;
            cursor: pointer; padding: 5px 8px; width: auto; margin: 0; line-height: 1;
            transition: color 0.2s; border-radius: 6px;
        }
        .btn-olho:hover { color: var(--vermelho-redplay); }

        .lembrar-wrap {
            display: flex; align-items: center; justify-content: center;
            gap: 8px; margin-top: 5px; margin-bottom: 10px;
            cursor: pointer; user-select: none;
        }
        .lembrar-wrap input[type="checkbox"] {
            width: 18px; height: 18px; padding: 0;
            accent-color: var(--vermelho-redplay); cursor: pointer;
        }
        .lembrar-wrap label { font-size: 13px; color: #bbb; cursor: pointer; text-transform: none; }

        button.btn-entrar { width: 100%; padding: 15px; margin-top: 10px; background: linear-gradient(90deg, var(--vermelho-redplay), var(--vermelho-escuro)); color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer; transition: all 0.3s ease; text-transform: uppercase; letter-spacing: 1px; }
        button.btn-entrar:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(229, 9, 20, 0.6); }

        .msg-erro { color: #ff4d4d; font-size: 13px; margin-top: 15px; font-weight: 600; opacity: 0; transition: opacity 0.3s; display: block; }

        /* ==========================================
           OVERLAY DE BLOQUEIO
           ========================================== */
        #overlay-bloqueio {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #1a0000 0%, #000000 50%, #1a0000 100%);
            z-index: 99999;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 25px;
            animation: fadeOverlay 0.5s ease;
        }
        #overlay-bloqueio.ativo { display: flex; }

        .icone-bloqueio { font-size: 90px; margin-bottom: 20px; animation: pulseIcone 1.5s infinite alternate; }

        #overlay-bloqueio h2 {
            color: var(--vermelho-redplay);
            font-size: 28px; font-weight: 900;
            text-transform: uppercase; letter-spacing: 2px;
            margin-bottom: 15px;
        }

        #overlay-bloqueio p {
            color: #ccc; font-size: 16px; line-height: 1.6;
            max-width: 500px; margin-bottom: 10px;
        }

        #overlay-bloqueio .motivo {
            color: #ff4d4d; font-weight: 700; font-size: 15px;
            margin-top: 5px; margin-bottom: 30px;
            padding: 10px 20px;
            background: rgba(229, 9, 20, 0.1);
            border: 1px solid rgba(229, 9, 20, 0.4);
            border-radius: 10px;
        }

        .btn-whatsapp {
            display: inline-flex; align-items: center; gap: 12px;
            background: linear-gradient(135deg, #25D366, #128C7E);
            color: white; border: none; padding: 18px 35px;
            border-radius: 50px; font-size: 17px; font-weight: 700;
            text-decoration: none; text-transform: uppercase;
            letter-spacing: 1px; cursor: pointer; transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(37, 211, 102, 0.4);
            margin-bottom: 25px;
        }
        .btn-whatsapp:hover { transform: scale(1.05); box-shadow: 0 12px 35px rgba(37, 211, 102, 0.7); }
        .btn-whatsapp svg { width: 26px; height: 26px; fill: white; }

        .numero-contato {
            color: #fff; font-size: 22px; font-weight: 900;
            letter-spacing: 2px; margin-bottom: 30px;
            font-family: monospace;
        }

        .rodape-bloqueio {
            color: #555; font-size: 12px;
            position: absolute; bottom: 25px; left: 0; right: 0;
            text-align: center;
        }

        @keyframes fadeOverlay { from { opacity: 0; } to { opacity: 1; } }
        @keyframes pulseIcone { from { transform: scale(0.95); } to { transform: scale(1.08); } }
        @keyframes pulseSplash { from { transform: scale(0.95); opacity: 0.8; } to { transform: scale(1.05); opacity: 1; } }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes pulseGlow { from { transform: translate(-50%, -50%) scale(1); opacity: 0.5; } to { transform: translate(-50%, -50%) scale(1.5); opacity: 1; } }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-5px); } 40%, 80% { transform: translateX(5px); } }
        
        .shake-animation { animation: shake 0.4s ease-in-out; border-color: #ff4d4d !important; background: rgba(255, 77, 77, 0.1) !important; }
        .loading { pointer-events: none; opacity: 0.7; }
    </style>
</head>
<body>

    <div id="splash-screen">
        <img src="download.png" alt="RedPlay Logo" class="splash-logo">
        <div class="loader"></div>
    </div>

    <div class="bg-glow"></div>

    <div class="login-box" id="caixa-login">
        <img src="download.png" alt="RedPlay" class="login-logo">
        <br>
        <span class="badge">V5 MAX SECURE</span>

        <div class="input-container">
            <input type="text" id="servidor" placeholder="Utilizador">
        </div>

        <div class="input-container">
            <div class="input-senha-wrap">
                <input type="password" id="senha" placeholder="Senha" onkeypress="verificarEnter(event)">
                <button type="button" class="btn-olho" id="btn-olho" onclick="toggleSenha()" tabindex="-1">👁️</button>
            </div>
        </div>

        <div class="lembrar-wrap">
            <input type="checkbox" id="lembrar">
            <label for="lembrar">Lembrar-me</label>
        </div>

        <button id="btn-entrar" class="btn-entrar" onclick="verificarAcesso()">Conectar</button>
        
        <span id="msg-erro" class="msg-erro">Utilizador ou senha incorretos.</span>
    </div>

    <!-- OVERLAY DE BLOQUEIO -->
    <div id="overlay-bloqueio">
        <div class="icone-bloqueio">🚫</div>
        <h2>Acesso Bloqueado</h2>
        <p>Sua conta foi <strong style="color: #ff4d4d;">desativada</strong> ou <strong style="color: #ff4d4d;">expirada</strong>.</p>
        <p>Para reativar, entre em contato pelo WhatsApp:</p>
        <div class="motivo" id="motivo-bloqueio">Conta desativada pelo administrador</div>
        
        <a href="https://wa.me/55997340723" target="_blank" class="btn-whatsapp" id="btn-whatsapp-bloqueio">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/>
            </svg>
            Falar no WhatsApp
        </a>

        <div class="numero-contato">📱 (55) 99973-40723</div>

        <div class="rodape-bloqueio">RedPlay MAX • Suporte ao Cliente</div>
    </div>

    <!-- BIBLIOTECA SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        // ==========================================
        // CONFIGURAÇÃO SUPABASE
        // ==========================================
        const SUPABASE_URL = "https://bknbydcaaalyeyncfyze.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJrbmJ5ZGNhYWFseWV5bmNmeXplIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA5OTUzODcsImV4cCI6MjEwNjU3MTM4N30.FMR90ELrwArXl3s3lko1c_Zy96rFkWrk7fTegOk6m_4";

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const STORAGE_KEY = "redplay_credenciais";
        const INTERVALO_VERIFICACAO = 2 * 60 * 1000; // 2 minutos

        let usuarioLogado = null;
        let intervaloVerificador = null;

        // ==========================================
        // SPLASH + CARREGAR CREDENCIAIS
        // ==========================================
        window.addEventListener('load', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                const caixaLogin = document.getElementById('caixa-login');
                const inputServidor = document.getElementById("servidor");
                
                splash.style.opacity = '0';
                
                setTimeout(() => {
                    splash.style.display = 'none';
                    caixaLogin.classList.add('show');
                    carregarCredenciaisSalvas();

                    if (inputServidor.value) {
                        document.getElementById("senha").focus();
                    } else {
                        inputServidor.focus();
                    }
                }, 800);
            }, 2500);
        });

        const inputServidor = document.getElementById("servidor");
        const inputSenha = document.getElementById("senha");
        const msgErro = document.getElementById("msg-erro");
        const btnEntrar = document.getElementById("btn-entrar");
        const chkLembrar = document.getElementById("lembrar");
        const btnOlho = document.getElementById("btn-olho");

        function verificarEnter(event) {
            if (event.key === "Enter") verificarAcesso();
        }

        // ==========================================
        // MOSTRAR / ESCONDER SENHA
        // ==========================================
        function toggleSenha() {
            if (inputSenha.type === "password") {
                inputSenha.type = "text";
                btnOlho.innerText = "🙈";
            } else {
                inputSenha.type = "password";
                btnOlho.innerText = "👁️";
            }
        }

        // ==========================================
        // LEMBRAR-ME
        // ==========================================
        function carregarCredenciaisSalvas() {
            try {
                const salvo = localStorage.getItem(STORAGE_KEY);
                if (salvo) {
                    const dados = JSON.parse(salvo);
                    inputServidor.value = dados.usuario || "";
                    inputSenha.value = dados.senha || "";
                    chkLembrar.checked = true;
                }
            } catch (e) {
                console.warn("Erro ao carregar credenciais:", e);
            }
        }

        function salvarCredenciais() {
            if (chkLembrar.checked) {
                const dados = {
                    usuario: inputServidor.value.trim(),
                    senha: inputSenha.value.trim()
                };
                localStorage.setItem(STORAGE_KEY, JSON.stringify(dados));
            } else {
                localStorage.removeItem(STORAGE_KEY);
            }
        }

        function limparCredenciaisSalvas() {
            localStorage.removeItem(STORAGE_KEY);
        }

        // ==========================================
        // VERIFICAÇÃO DE LOGIN
        // ==========================================
        async function verificarAcesso() {
            const usuarioDigitado = inputServidor.value.trim();
            const senhaDigitada = inputSenha.value.trim();

            inputServidor.classList.remove("shake-animation");
            inputSenha.classList.remove("shake-animation");
            msgErro.style.opacity = "0";

            if (!usuarioDigitado || !senhaDigitada) {
                inputServidor.classList.add("shake-animation");
                inputSenha.classList.add("shake-animation");
                msgErro.innerText = "Preencha utilizador e senha.";
                msgErro.style.opacity = "1";
                return;
            }

            btnEntrar.classList.add("loading");
            btnEntrar.innerText = "A VERIFICAR...";

            try {
                const { data, error } = await supabaseClient
                    .from('utilizadores')
                    .select('usuario, ativo, vencimento')
                    .eq('usuario', usuarioDigitado)
                    .eq('senha', senhaDigitada)
                    .maybeSingle();

                if (error) throw error;

                if (!data) {
                    limparCredenciaisSalvas();
                    erroLogin("Utilizador ou senha incorretos.");
                    return;
                }

                if (!data.ativo) {
                    erroLogin("Conta desativada. Contacte o suporte.");
                    return;
                }

                if (data.vencimento) {
                    const hoje = new Date();
                    hoje.setHours(0, 0, 0, 0);
                    const venc = new Date(data.vencimento + "T00:00:00");
                    if (venc < hoje) {
                        erroLogin("Acesso expirado. Renove a sua assinatura.");
                        return;
                    }
                }

                // ✅ SUCESSO
                salvarCredenciais();
                usuarioLogado = data.usuario;

                btnEntrar.classList.remove("loading");
                btnEntrar.innerText = "CONECTADO";
                btnEntrar.style.background = "#00c853";

                iniciarMonitoramento();

                setTimeout(() => {
                    if (typeof AndroidApp !== 'undefined') {
                        AndroidApp.liberarAcesso();
                    } else {
                        alert("✅ Conectado com sucesso!\n\nBem-vindo, " + data.usuario + "!");
                    }
                }, 500);

            } catch (err) {
                console.error("Erro Supabase:", err);
                erroLogin("Erro de conexão. Tente novamente.");
            }
        }

        function erroLogin(mensagem) {
            btnEntrar.classList.remove("loading");
            btnEntrar.innerText = "CONECTAR";
            btnEntrar.style.background = "";

            inputServidor.classList.add("shake-animation");
            inputSenha.classList.add("shake-animation");
            msgErro.innerText = mensagem;
            msgErro.style.opacity = "1";

            inputSenha.value = "";
            inputSenha.focus();
        }

        // ==========================================
        // MONITORAMENTO EM BACKGROUND
        // ==========================================
        function iniciarMonitoramento() {
            if (intervaloVerificador) clearInterval(intervaloVerificador);
            verificarStatusConta();
            intervaloVerificador = setInterval(verificarStatusConta, INTERVALO_VERIFICACAO);
            console.log("🛡️ Monitoramento iniciado.");
        }

        async function verificarStatusConta() {
            if (!usuarioLogado) return;

            try {
                const { data, error } = await supabaseClient
                    .from('utilizadores')
                    .select('ativo, vencimento')
                    .eq('usuario', usuarioLogado)
                    .maybeSingle();

                if (error || !data) {
                    console.warn("⚠️ Não foi possível verificar status agora.");
                    return;
                }

                if (!data.ativo) {
                    bloquearAcesso("Conta desativada pelo administrador");
                    return;
                }

                if (data.vencimento) {
                    const hoje = new Date();
                    hoje.setHours(0, 0, 0, 0);
                    const venc = new Date(data.vencimento + "T00:00:00");
                    if (venc < hoje) {
                        bloquearAcesso("Assinatura expirada em " + data.vencimento);
                        return;
                    }
                }

                console.log("✅ Conta ativa. Verificado às " + new Date().toLocaleTimeString());

            } catch (err) {
                console.warn("⚠️ Erro ao verificar status:", err);
            }
        }

        // ==========================================
        // BLOQUEIO
        // ==========================================
        function bloquearAcesso(motivo) {
            if (intervaloVerificador) {
                clearInterval(intervaloVerificador);
                intervaloVerificador = null;
            }

            document.getElementById("motivo-bloqueio").innerText = motivo;

            const numero = "55997340723";
            const texto = encodeURIComponent("Olá! Minha conta RedPlay (" + usuarioLogado + ") foi bloqueada. Motivo: " + motivo + ". Podem me ajudar?");
            document.getElementById("btn-whatsapp-bloqueio").href = "https://wa.me/" + numero + "?text=" + texto;

            document.getElementById("overlay-bloqueio").classList.add("ativo");
            limparCredenciaisSalvas();

            if (typeof AndroidApp !== 'undefined' && typeof AndroidApp.bloquearAcesso === 'function') {
                try { AndroidApp.bloquearAcesso(); } catch (e) {}
            }
        }

        // ==========================================
        // VERIFICAÇÃO AO VOLTAR DO BACKGROUND
        // ==========================================
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden && usuarioLogado) {
                console.log("🔄 App voltou ao foco — verificando status...");
                verificarStatusConta();
            }
        });

    </script>
</body>
</html>
