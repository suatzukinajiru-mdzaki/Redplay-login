<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <title>RedPlay TV</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --vermelho: #e50914;
            --verde: #00c853;
            --amarelo: #ffab00;
            --dourado: #ffc107;
            --roxo: #8e24aa;
            --texto: #ffffff;
            --texto-suave: #a0a0a0;
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Montserrat', Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            background: #000;
            color: #fff;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 4vh 4vw;
            background: 
                radial-gradient(ellipse at top, rgba(229,9,20,0.15) 0%, transparent 50%),
                radial-gradient(ellipse at bottom, rgba(139,0,0,0.1) 0%, transparent 50%),
                #000;
            background-attachment: fixed;
        }

        /* ================= SPLASH ================= */
        #splash {
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at center, #1a0000 0%, #000 70%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            transition: opacity 0.5s ease-out;
        }
        .splash-logo {
            width: clamp(180px, 25vw, 280px);
            margin-bottom: 50px;
            animation: splashFloat 2.5s ease-in-out infinite;
            filter: drop-shadow(0 0 40px rgba(229,9,20,0.6));
        }
        @keyframes splashFloat {
            0%, 100% { transform: scale(1) translateY(0); opacity: 0.9; }
            50% { transform: scale(1.05) translateY(-10px); opacity: 1; }
        }
        .loader {
            width: clamp(50px, 8vh, 70px);
            height: clamp(50px, 8vh, 70px);
            border: 6px solid rgba(229,9,20,0.15);
            border-top-color: #e50914;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            box-shadow: 0 0 40px rgba(229,9,20,0.4);
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .splash-txt {
            color: #666;
            font-size: 14px;
            letter-spacing: 6px;
            margin-top: 28px;
            text-transform: uppercase;
            font-weight: 800;
        }

        /* ================= CARD ================= */
        .card {
            position: relative;
            background: linear-gradient(135deg, rgba(20,20,20,0.98) 0%, rgba(10,10,10,0.98) 100%);
            border: 2px solid rgba(229,9,20,0.3);
            border-radius: 30px;
            padding: clamp(30px, 4vh, 55px) clamp(35px, 5vw, 65px);
            width: 100%;
            max-width: min(1000px, 92vw);
            max-height: 100%;
            overflow-y: auto;
            overflow-x: hidden;
            text-align: center;
            box-shadow: 
                0 30px 90px rgba(0,0,0,0.9),
                0 0 150px rgba(229,9,20,0.15);
            animation: cardFadeIn 0.5s ease;
            display: none;
            margin: auto;
        }
        .card.ativo { display: block; }
        @keyframes cardFadeIn {
            from { opacity: 0; transform: translateY(30px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .card::-webkit-scrollbar { width: 6px; }
        .card::-webkit-scrollbar-track { background: transparent; }
        .card::-webkit-scrollbar-thumb { 
            background: linear-gradient(180deg, #e50914, #b20710);
            border-radius: 3px;
        }

        .logo-red {
            width: clamp(120px, 14vw, 180px);
            margin-bottom: clamp(15px, 2vh, 25px);
            display: inline-block;
            filter: drop-shadow(0 0 20px rgba(229,9,20,0.5));
        }

        .badge {
            display: inline-block;
            background: linear-gradient(135deg, #e50914, #b20710);
            font-size: clamp(10px, 1vh, 12px);
            font-weight: 800;
            padding: clamp(6px, 0.8vh, 10px) clamp(16px, 2vw, 26px);
            border-radius: 25px;
            margin-bottom: clamp(15px, 2vh, 25px);
            letter-spacing: 4px;
            box-shadow: 0 0 40px rgba(229,9,20,0.6);
        }
        .badge-amarelo { 
            background: linear-gradient(135deg, #ffab00, #ff8f00); 
            color: #000; 
        }
        .badge-verde { 
            background: linear-gradient(135deg, #00c853, #00a844);
        }

        h1 {
            color: #fff;
            font-size: clamp(24px, 3.5vh, 42px);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: clamp(8px, 1.2vh, 15px);
            background: linear-gradient(180deg, #fff 0%, #e50914 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.1;
        }
        h2 {
            color: #fff;
            font-size: clamp(20px, 2.8vh, 34px);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: clamp(10px, 1.5vh, 18px);
        }
        p {
            color: #ccc;
            font-size: clamp(13px, 1.7vh, 17px);
            line-height: 1.5;
            margin-bottom: clamp(8px, 1vh, 14px);
            font-weight: 500;
        }

        /* ================= BARRA TOPO (JÁ TENHO CONTA) ================= */
        .barra-topo {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            margin-bottom: clamp(15px, 2vh, 25px);
            padding-bottom: clamp(12px, 1.5vh, 20px);
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        .btn-entrar-topo {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: clamp(10px, 1.4vh, 14px) clamp(18px, 2vw, 26px);
            background: transparent;
            color: #fff;
            border: 2px solid #444;
            border-radius: 50px;
            font-size: clamp(12px, 1.5vh, 15px);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.25s ease;
            outline: none;
        }

        .btn-entrar-topo:hover {
            border-color: #e50914;
            color: #e50914;
        }

        .btn-entrar-topo:focus,
        .btn-entrar-topo.foco {
            border-color: #fff;
            background: rgba(229,9,20,0.15);
            color: #fff;
            transform: scale(1.05);
            box-shadow: 
                0 0 0 3px #fff,
                0 0 40px rgba(255,255,255,0.5),
                0 0 30px rgba(229,9,20,0.6);
        }

        .btn-entrar-topo .icone { font-size: clamp(15px, 1.9vh, 19px); }

        /* ================= TRIAL ================= */
        .trial-container {
            position: relative;
            margin: clamp(15px, 2.5vh, 30px) 0;
            padding: clamp(25px, 3.5vh, 45px) clamp(20px, 3vw, 40px);
            background: linear-gradient(135deg, rgba(229,9,20,0.2) 0%, rgba(255,171,0,0.08) 100%);
            border: 3px solid rgba(229,9,20,0.5);
            border-radius: 26px;
            overflow: hidden;
            box-shadow: 
                inset 0 0 80px rgba(229,9,20,0.15),
                0 0 60px rgba(229,9,20,0.2);
        }
        .trial-container::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: conic-gradient(from 0deg, transparent, rgba(229,9,20,0.25), transparent 30%);
            animation: rotate 10s linear infinite;
        }
        @keyframes rotate { to { transform: rotate(360deg); } }
        .trial-inner { position: relative; z-index: 1; }
        
        .trial-icone {
            font-size: clamp(50px, 7vh, 80px);
            margin-bottom: clamp(8px, 1vh, 15px);
            animation: pulseIcone 1.8s infinite alternate;
            filter: drop-shadow(0 0 30px rgba(255,171,0,0.6));
            line-height: 1;
        }
        @keyframes pulseIcone { 
            from { transform: scale(1); } 
            to { transform: scale(1.12); } 
        }
        
        .trial-label {
            color: #ffc107;
            font-size: clamp(10px, 1.3vh, 14px);
            font-weight: 800;
            letter-spacing: 6px;
            margin-bottom: clamp(8px, 1.2vh, 18px);
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(255,193,7,0.6);
        }
        
        .trial-dias {
            display: flex;
            justify-content: center;
            align-items: baseline;
            gap: clamp(12px, 1.5vw, 22px);
            margin: clamp(8px, 1vh, 15px) 0 clamp(15px, 2vh, 28px);
        }
        
        .trial-numero {
            font-size: clamp(70px, 13vh, 130px);
            font-weight: 900;
            line-height: 1;
            background: linear-gradient(180deg, #fff 0%, #e50914 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 50px rgba(229,9,20,0.9));
            animation: numeroPulse 2s ease-in-out infinite;
        }
        @keyframes numeroPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.04); }
        }
        
        .trial-texto {
            font-size: clamp(18px, 2.5vh, 28px);
            font-weight: 900;
            color: #e50914;
            text-transform: uppercase;
            letter-spacing: 3px;
            line-height: 1.1;
        }
        .trial-texto small {
            display: block;
            font-size: clamp(10px, 1.2vh, 13px);
            color: #888;
            font-weight: 700;
            letter-spacing: 5px;
            margin-top: 6px;
        }
        
        .trial-beneficios {
            margin-top: clamp(15px, 2vh, 25px);
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: clamp(8px, 1vh, 14px);
        }
        .trial-beneficio {
            background: rgba(0,0,0,0.6);
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 14px;
            padding: clamp(8px, 1.2vh, 14px) clamp(10px, 1.5vw, 18px);
            font-size: clamp(12px, 1.5vh, 15px);
            color: #ddd;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
            justify-content: center;
        }
        .trial-beneficio span:first-child { font-size: clamp(16px, 2vh, 22px); }

        .trial-destaque {
            background: rgba(0,0,0,0.6);
            border-left: 6px solid #ffc107;
            border-radius: 14px;
            padding: clamp(12px, 1.6vh, 20px) clamp(15px, 2vw, 26px);
            text-align: left;
            font-size: clamp(12px, 1.5vh, 16px);
            color: #fff;
            font-weight: 700;
            margin-top: clamp(15px, 2vh, 25px);
            line-height: 1.5;
        }
        .trial-destaque strong { color: #ffc107; }

        /* ================= BOTÕES ================= */
        button { cursor: pointer; border: none; font-family: inherit; background: none; }
        
        .btn {
            width: 100%;
            padding: clamp(14px, 2vh, 22px) clamp(20px, 2vw, 32px);
            border-radius: 16px;
            font-size: clamp(14px, 1.9vh, 19px);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.25s ease;
            margin-bottom: clamp(8px, 1.2vh, 15px);
            outline: none;
            border: 3px solid transparent;
        }
        
        .btn-primario {
            background: linear-gradient(135deg, #e50914 0%, #b20710 100%);
            color: #fff;
            box-shadow: 0 8px 35px rgba(229,9,20,0.5);
        }
        
        .btn-whats {
            background: linear-gradient(135deg, #25D366 0%, #128C7E 100%);
            color: #fff;
            text-decoration: none;
            display: inline-block;
            box-shadow: 0 8px 35px rgba(37,211,102,0.4);
        }
        
        .btn-cinza {
            background: rgba(255,255,255,0.05);
            color: #ccc;
            border: 3px solid #333;
        }

        .btn:focus, .btn.foco {
            transform: scale(1.04);
            border-color: #fff;
            box-shadow: 
                0 0 0 4px rgba(255,255,255,0.9),
                0 0 50px rgba(255,255,255,0.6),
                0 12px 40px rgba(0,0,0,0.9);
            outline: none;
            z-index: 10;
        }
        .btn-primario:focus, .btn-primario.foco {
            box-shadow: 0 0 0 4px #fff, 0 0 55px rgba(255,255,255,0.7), 0 15px 50px rgba(229,9,20,0.9);
        }
        .btn-whats:focus, .btn-whats.foco {
            box-shadow: 0 0 0 4px #fff, 0 0 55px rgba(255,255,255,0.7), 0 15px 50px rgba(37,211,102,0.9);
        }
        .btn-cinza:focus, .btn-cinza.foco {
            color: #fff;
            background: rgba(255,255,255,0.1);
        }

        /* ================= INPUTS ================= */
        .input-container {
            margin-bottom: clamp(12px, 1.6vh, 20px);
            position: relative;
        }
        
        input {
            width: 100%;
            padding: clamp(15px, 2.2vh, 22px) clamp(18px, 2vw, 26px);
            background: rgba(0,0,0,0.7);
            border: 3px solid #333;
            border-radius: 14px;
            color: #fff;
            font-size: clamp(16px, 2.1vh, 21px);
            font-weight: 700;
            text-align: center;
            transition: all 0.25s ease;
            outline: none;
        }
        input:focus {
            border-color: #e50914;
            box-shadow: 0 0 0 4px rgba(229,9,20,0.3), 0 0 45px rgba(229,9,20,0.6);
            background: rgba(0,0,0,0.9);
            transform: scale(1.02);
        }
        input::placeholder {
            color: #555;
            text-transform: uppercase;
            font-size: clamp(11px, 1.4vh, 15px);
            font-weight: 700;
            letter-spacing: 3px;
        }

        .input-senha-wrap { position: relative; }
        .input-senha-wrap input { padding-right: clamp(60px, 6vw, 85px); }
        .btn-olho {
            position: absolute;
            right: clamp(15px, 1.5vw, 22px);
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            color: #666;
            font-size: clamp(20px, 2.8vh, 28px);
            cursor: pointer;
            padding: 8px 12px;
            outline: none;
            border-radius: 10px;
        }
        .btn-olho:focus {
            color: #e50914;
            background: rgba(229,9,20,0.2);
            outline: 3px solid #fff;
        }

        /* ================= LEMBRAR ================= */
        .lembrar-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin: clamp(12px, 1.6vh, 20px) 0;
            padding: clamp(10px, 1.2vh, 14px) clamp(16px, 2vw, 22px);
            border-radius: 14px;
            cursor: pointer;
            outline: none;
            border: 3px solid transparent;
        }
        .lembrar-wrap:focus, .lembrar-wrap.foco {
            background: rgba(229,9,20,0.15);
            box-shadow: 0 0 0 4px #fff, 0 0 35px rgba(255,255,255,0.5);
            border-color: #fff;
            transform: scale(1.03);
        }
        .lembrar-wrap input[type="checkbox"] {
            width: clamp(20px, 2.5vh, 26px);
            height: clamp(20px, 2.5vh, 26px);
            accent-color: #e50914;
            cursor: pointer;
        }
        .lembrar-wrap label {
            font-size: clamp(14px, 1.8vh, 17px);
            color: #ddd;
            font-weight: 700;
            cursor: pointer;
        }

        /* ================= PLANOS ================= */
        .plano-card {
            position: relative;
            background: linear-gradient(135deg, #1a1a1a 0%, #0f0f0f 100%);
            border: 3px solid #2a2a2a;
            border-radius: 20px;
            padding: clamp(16px, 2.2vh, 28px) clamp(20px, 2.5vw, 32px);
            margin-bottom: clamp(10px, 1.4vh, 16px);
            text-align: left;
            cursor: pointer;
            transition: all 0.3s ease;
            outline: none;
        }
        .plano-card::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 8px;
            background: linear-gradient(180deg, #e50914, #b20710);
            border-radius: 20px 0 0 20px;
            transform: scaleY(0);
            transition: transform 0.3s;
        }
        .plano-card:focus, .plano-card.foco {
            border-color: #fff;
            transform: translateY(-4px) scale(1.02);
            background: linear-gradient(135deg, #282828 0%, #181818 100%);
            box-shadow: 0 0 0 4px #fff, 0 0 55px rgba(255,255,255,0.5), 0 18px 45px rgba(229,9,20,0.5);
            z-index: 5;
        }
        .plano-card:focus::before, .plano-card.foco::before { transform: scaleY(1); }
        
        .plano-card.destaque {
            border-color: #ffab00;
            background: linear-gradient(135deg, rgba(255,171,0,0.15) 0%, #0f0f0f 100%);
        }
        .plano-card.destaque::before { background: linear-gradient(180deg, #ffab00, #ff8f00); }

        .plano-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: clamp(5px, 0.7vh, 10px);
            gap: 12px;
            flex-wrap: wrap;
        }
        .plano-nome {
            color: #fff;
            font-size: clamp(15px, 2.1vh, 23px);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .plano-preco {
            color: #00c853;
            font-size: clamp(19px, 2.8vh, 32px);
            font-weight: 900;
            white-space: nowrap;
            text-shadow: 0 0 25px rgba(0,200,83,0.5);
        }
        .plano-card.destaque .plano-preco { 
            color: #ffc107;
            text-shadow: 0 0 25px rgba(255,193,7,0.5);
        }
        .plano-desc {
            color: #999;
            font-size: clamp(11px, 1.4vh, 14px);
            font-weight: 600;
        }
        .plano-tag {
            display: inline-block;
            background: linear-gradient(135deg, #ffab00, #ff8f00);
            color: #000;
            font-size: clamp(9px, 1vh, 11px);
            font-weight: 900;
            padding: 4px 12px;
            border-radius: 10px;
            margin-left: 10px;
            letter-spacing: 2px;
            vertical-align: middle;
        }
        .plano-tag.verde { background: linear-gradient(135deg, #00c853, #00a844); color: #fff; }
        .plano-tag.roxo { background: linear-gradient(135deg, #8e24aa, #6a1b9a); color: #fff; }

        /* ================= QR CODE ================= */
        .qr-img {
            background: #fff;
            border-radius: 22px;
            padding: clamp(14px, 2vh, 22px);
            margin: clamp(15px, 2vh, 28px) auto;
            max-width: clamp(200px, 30vh, 320px);
            box-shadow: 0 18px 55px rgba(0,0,0,0.7), 0 0 70px rgba(229,9,20,0.3);
        }
        .qr-img img { width: 100%; display: block; border-radius: 12px; }

        .pix-code {
            background: #000;
            border: 2px solid #2a2a2a;
            border-radius: 14px;
            padding: clamp(12px, 1.6vh, 18px);
            font-family: monospace;
            font-size: clamp(10px, 1.2vh, 13px);
            word-break: break-all;
            color: #999;
            text-align: left;
            margin-bottom: clamp(12px, 1.6vh, 20px);
            max-height: clamp(60px, 10vh, 100px);
            overflow-y: auto;
        }

        .polling-status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: #ffab00;
            font-size: clamp(12px, 1.6vh, 16px);
            margin-bottom: clamp(12px, 1.6vh, 20px);
            font-weight: 800;
            padding: clamp(12px, 1.6vh, 18px);
            background: rgba(255,171,0,0.1);
            border: 2px solid rgba(255,171,0,0.35);
            border-radius: 14px;
        }
        .mini-loader {
            border: 4px solid rgba(255,171,0,0.2);
            border-top-color: #ffab00;
            border-radius: 50%;
            width: clamp(20px, 2.8vh, 28px);
            height: clamp(20px, 2.8vh, 28px);
            animation: spin 0.8s linear infinite;
        }

        /* ================= FORM ================= */
        .field {
            margin-bottom: clamp(12px, 1.6vh, 20px);
            text-align: left;
        }
        .field label {
            display: block;
            color: #999;
            font-size: clamp(10px, 1.3vh, 13px);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            margin-bottom: clamp(6px, 0.8vh, 10px);
        }
        .msg-erro {
            color: #ff4d4d;
            font-size: clamp(12px, 1.5vh, 15px);
            margin-top: 12px;
            font-weight: 800;
            min-height: 20px;
            display: block;
        }

        /* ================= BOAS-VINDAS ================= */
        .bv-emoji {
            font-size: clamp(70px, 12vh, 120px);
            margin-bottom: clamp(15px, 2vh, 25px);
            animation: pulseIcone 1.8s infinite alternate;
            filter: drop-shadow(0 0 50px rgba(229,9,20,0.6));
            line-height: 1;
        }
        .bv-usuario {
            color: #fff;
            font-size: clamp(22px, 3.5vh, 42px);
            font-weight: 900;
            margin-bottom: clamp(20px, 2.5vh, 30px);
            padding: clamp(12px, 1.8vh, 22px) clamp(25px, 3.5vw, 45px);
            background: rgba(229,9,20,0.15);
            border: 3px solid rgba(229,9,20,0.6);
            border-radius: 60px;
            display: inline-block;
            box-shadow: 0 0 50px rgba(229,9,20,0.5);
            letter-spacing: 3px;
        }
        .bv-mensagem {
            color: #fff;
            font-size: clamp(16px, 2.3vh, 28px);
            font-weight: 800;
            margin-bottom: clamp(20px, 2.5vh, 30px);
            line-height: 1.4;
        }
        .bv-mensagem span {
            color: #e50914;
            font-weight: 900;
        }
        .bv-status {
            display: inline-block;
            padding: clamp(12px, 1.8vh, 18px) clamp(25px, 3vw, 38px);
            background: rgba(0,200,83,0.15);
            border: 3px solid rgba(0,200,83,0.6);
